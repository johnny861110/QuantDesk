[project]
name = "quantdesk"
version = "0.1.0"
description = "多智能體量化研究桌系統"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "langgraph>=0.2",
    "scipy>=1.17.1",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "yfinance>=1.5.1",
    "financial-reports",
    "financial-agent",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "feedparser>=6.0.12",
    "tavily-python>=0.7.26",
    "openai>=2.46.0",
    "langfuse>=4.14.0",
    "streamlit>=1.59.2",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "cachetools>=7.1.4",
    "ruamel-yaml>=0.19.1",
]
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20260518",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: hits real SQLiteStore / filesystem; run with: uv run pytest -m integration",
]

[tool.coverage.run]
source = ["agents", "adapters", "supervisor", "schemas", "api"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
[tool.ruff]
target-version = "py311"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["schemas", "adapters", "supervisor", "agents"]
[tool.uv.sources]
financial-reports = { path = "../FinancialReports", editable = true }
financial-agent = { path = "../Financial_Agent", editable = true }
