name: CI
on:
  push:
    branches: [main]
  # 刻意不限制 base 分支。
  #
  # 原本是 `pull_request: branches: [main]`，該過濾器是依 **base 分支**判定，
  # 導致任何 base 不是 main 的 PR 完全拿不到 CI —— stacked PR（把 Phase N+1
  # 疊在尚未合併的 Phase N 之上）是本專案的常見做法，卻會裸奔通過 review。
  #
  # 實際踩到：PR #35 base 指向 phase-16-hardening 時顯示 "no checks reported"，
  # 直到 #34 合併、base 自動 retarget 成 main 之後 CI 才第一次跑起來。
  # 那段期間 review 者看到的是「沒有紅燈」，而非「驗證通過」——兩者意義完全不同。
  #
  # 成本：CI 只在有 PR 活動時觸發，不是每次 push；用量由 PR 數量自然限制。
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quantdesk-starter
        uses: actions/checkout@v4
        with:
          path: quantdesk-starter

      - name: Checkout FinancialReports (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: johnny861110/FinancialReports
          path: FinancialReports

      - name: Checkout Financial_Agent (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: johnny861110/Financial_Agent
          path: Financial_Agent

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        working-directory: quantdesk-starter
        run: uv python install

      - name: Sync dependencies
        working-directory: quantdesk-starter
        run: uv sync --all-groups

      - name: Lint
        working-directory: quantdesk-starter
        run: uv run ruff check .

      - name: Type check
        working-directory: quantdesk-starter
        run: uv run mypy .

      - name: Test with coverage
        working-directory: quantdesk-starter
        run: uv run pytest -q --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quantdesk-starter
        uses: actions/checkout@v4
        with:
          path: quantdesk-starter

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: quantdesk-starter/dashboard/package-lock.json

      - name: Install
        working-directory: quantdesk-starter/dashboard
        run: npm ci

      - name: Type check & build
        working-directory: quantdesk-starter/dashboard
        run: npm run build
